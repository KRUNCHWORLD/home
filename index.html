<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script>
  // Randomly display Transmission_001 inside the homepage.
  // The browser stays at krunch.world, so every reload rerolls the experience.
  if (Math.random() < 0.75) {
    window.addEventListener("DOMContentLoaded", function () {
      const frame = document.createElement("iframe");
      frame.src = "/transmission/";
      frame.title = "KRUNCH.WORLD — Transmission_001";
      frame.style.cssText = "position:fixed;inset:0;width:100%;height:100%;border:0;z-index:999999;background:#000;";
      document.body.appendChild(frame);
    });
  }
</script>

<title>Welcome</title>

<link rel="stylesheet" href="style.css">


<style>
  .krunch-lab-link {
    position: fixed; right: 24px; bottom: 22px; z-index: 1000001;
    display: inline-flex; align-items: center; gap: 9px;
    padding: 12px 16px; border: 1px solid rgba(232,234,216,.72);
    background: rgba(45,54,45,.88); color: #e8ead8;
    font: 700 11px/1 Arial, sans-serif; letter-spacing: .2em;
    text-decoration: none; backdrop-filter: blur(8px);
    box-shadow: 0 4px 22px rgba(0,0,0,.3);
    transition: background .2s, color .2s, border-color .2s;
  }
  .krunch-lab-link::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #d6f45b; box-shadow: 0 0 10px #d6f45b; }
  .krunch-lab-link:hover { background: #d6f45b; color: #293126; border-color: #d6f45b; }
  .krunch-lab-link:hover::before { background: #293126; box-shadow: none; }
  @media(max-width:600px) { .krunch-lab-link { right: 12px; bottom: 12px; padding: 11px 13px; } }
</style>

</head>

<body>

<video id="bgVideo" autoplay muted loop playsinline>
</video>

<script>
const videos = [
    "cows.mp4",
    "vents.mp4",
    "video.mp4"
];

const randomVideo = videos[Math.floor(Math.random() * videos.length)];

const video = document.getElementById("bgVideo");
video.src = randomVideo;
video.load();
</script>

<script src="script.js"></script>


<a class="krunch-lab-link" href="/lab/" aria-label="Open the KRUNCH.WORLD Granular Lab">LAB</a>

</body>
</html>
