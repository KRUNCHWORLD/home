<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Transmission is an experience inside the homepage, not a standalone destination.
    if (window.top === window.self) {
      window.location.replace("/");
    }
  </script>
  <meta name="theme-color" content="#080808">
  <meta name="description" content="4 for Future — A transmission from KRUNCH.WORLD is on its way.">

  <link rel="stylesheet" href="style.css">
</head>

  <main class="transmission">
    <div class="circuit" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <div class="angels" aria-hidden="true">
      <img class="angel angel-left" src="assets/angel-kdbb.png" alt="">
      <img class="angel angel-right" src="assets/angel-akr.png" alt="">

    <div class="stones" aria-hidden="true">
      <img class="stone stone-one" src="assets/stone.png" alt="">

      <img class="stone stone-three" src="assets/stone.png" alt="">
      <img class="stone stone-four" src="assets/stone.png" alt="">

    <header class="topline">
      <span>KRUNCH.WORLD</span>

    <section class="message" aria-label="Transmission message">
      <div class="message-copy">
        <h1>4 for Future</h1>
        <p>A transmission from KRUNCH.WORLD is on its way</p>
        <p>LOVE equals FUTURE</p>
